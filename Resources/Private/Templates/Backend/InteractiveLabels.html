<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">
    <section>
        <h1 class="mb-3">
            <f:translate
                key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:interactiveLabels"
            />
        </h1>
        <f:if condition="{findings -> f:count()} > 0">
            <f:then>
                <ul class="list-unstyled mb-0" role="list">
                    <f:for
                        each="{findings}"
                        as="finding"
                        iteration="iterator"
                    >
                        <li class="{f:if(condition: iterator.isLast, else: 'mb-3')}">
                            <div class="card">
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label
                                            class="form-label"
                                            for="interactive-label-{finding.uid}"
                                        >
                                            Label
                                        </label>

                                        <input
                                            type="text"
                                            id="interactive-label-{finding.uid}"
                                            class="form-control"
                                            value="{finding.value}"
                                        />

                                        <div class="d-flex flex-column gap-3 mt-3">

                                            <f:switch expression="{finding.rule}">

                                                <f:case value="potentially_vague_interactive_label">
                                                    <mindfula11y-notice state="warning">
                                                        <span>
                                                            <strong>
                                                                <f:translate
                                                                    key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.title.potentially_vague_interactive_label"
                                                                />
                                                            </strong>

                                                            <br />

                                                            <f:translate
                                                                key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.potentially_vague_interactive_label"
                                                            />
                                                        </span>
                                                    </mindfula11y-notice>
                                                </f:case>

                                                <f:case value="symbol_only_label">
                                                    <mindfula11y-notice state="warning">
                                                        <span>
                                                            <strong>
                                                                <f:translate
                                                                    key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.title.symbol_only_label"
                                                                />
                                                            </strong>

                                                            <br />

                                                            <f:translate
                                                                key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.symbol_only_label"
                                                            />
                                                        </span>
                                                    </mindfula11y-notice>
                                                </f:case>


                                                <f:case value="repeated_generic_label">
                                                    <mindfula11y-notice
                                                        state="warning"
                                                        count="{finding.occurrenceCount}"
                                                    >
                                                        <span>
                                                            <strong>
                                                                <f:translate
                                                                    key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.title.repeated_generic_label"
                                                                />
                                                            </strong>

                                                            <br />

                                                            <f:translate
                                                                key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.repeated_generic_label"
                                                            />
                                                        </span>
                                                    </mindfula11y-notice>
                                                </f:case>

                                                <f:case value="generic_label_different_targets">
                                                    <mindfula11y-notice
                                                        state="warning"
                                                        count="{finding.distinctTargetCount}"
                                                    >
                                                        <span>
                                                            <strong>
                                                                <f:translate
                                                                    key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.title.generic_label_different_targets"
                                                                />
                                                            </strong>

                                                            <br />

                                                            <f:translate
                                                                key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.generic_label_different_targets"
                                                            />
                                                        </span>
                                                    </mindfula11y-notice>
                                                </f:case>

                                            </f:switch>

                                            <f:if condition="{finding.isRepeated}">
                                                <f:if condition="{finding.rule} != 'repeated_generic_label'">
                                                    <mindfula11y-notice
                                                        state="warning"
                                                        count="{finding.occurrenceCount}"
                                                    >
                                                        <span>
                                                            <strong>
                                                                <f:translate
                                                                    key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.title.repeated_generic_label"
                                                                />
                                                            </strong>

                                                            <br />

                                                            <f:translate
                                                                key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.repeated_generic_label"
                                                            />
                                                        </span>
                                                    </mindfula11y-notice>
                                                </f:if>
                                            </f:if>

                                            <f:if condition="{finding.hasDifferentTargets}">
                                                <f:if condition="{finding.rule} != 'generic_label_different_targets'">
                                                    <mindfula11y-notice
                                                        state="warning"
                                                        count="{finding.distinctTargetCount}"
                                                    >
                                                        <span>
                                                            <strong>
                                                                <f:translate
                                                                    key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.title.generic_label_different_targets"
                                                                />
                                                            </strong>

                                                            <br />

                                                            <f:translate
                                                                key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:findings.rule.generic_label_different_targets"
                                                            />
                                                        </span>
                                                    </mindfula11y-notice>
                                                </f:if>
                                            </f:if>

                                        </div>
                                    </div>
                                    <div class="d-flex gap-2 mb-3">
                                        <button
                                            type="button"
                                            class="btn btn-default"
                                        >
                                            <core:icon
                                                identifier="actions-save"
                                                size="small"
                                            />

                                            Speichern
                                        </button>
                                    </div>
                                    <div class="border-top pt-3">
                                        <be:link.editRecord
                                            uid="{finding.uid}"
                                            table="{finding.table}"
                                            returnUrl="{f:be.uri(
                                                route: 'mindfula11y_accessibility',
                                                parameters: '{id: pageId, feature: \'interactiveLabels\'}'
                                            )}"
                                        >
                                            Element vollständig bearbeiten
                                        </be:link.editRecord>
                                    </div>
                                </div>
                            </div>
                        </li>
                    </f:for>
                </ul>
            </f:then>
            <f:else>
                <mindfula11y-notice state="success">
                    <span>
                        <f:translate
                            key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:interactiveLabels.noFindings"
                        />
                    </span>
                </mindfula11y-notice>
            </f:else>
        </f:if>
    </section>
</f:section>
</html>
