<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module" />

<f:section name="Content">
    <section>
        <h1 class="mb-3">
            <f:translate
                key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:interactiveLabels"
            />
        </h1>
        <f:if condition="{findings -> f:count()} > 0">
            <f:then>
                <ul class="list-unstyled mb-0" role="list">
                    <f:for
                        each="{findings}"
                        as="finding"
                        iteration="iterator"
                    >
                        <li class="{f:if(condition: iterator.isLast, else: 'mb-3')}">
                            <div class="card">
                                <div class="card-body">
                                    <div class="mb-3">
                                        <strong>
                                            {finding.type.value}
                                        </strong>
                                        <div class="text-body-secondary small mt-1">
                                            WCAG {finding.wcagCriterion}
                                            ({finding.wcagLevel})
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label
                                            class="form-label"
                                            for="interactive-label-{finding.uid}"
                                        >
                                            Label
                                        </label>
                                        <input
                                            type="text"
                                            id="interactive-label-{finding.uid}"
                                            class="form-control"
                                            value="{finding.value}"
                                        />
                                        <div class="form-text">
                                            {finding.rule}
                                        </div>
                                    </div>
                                    <div class="d-flex gap-2 mb-3">
                                        <button
                                            type="button"
                                            class="btn btn-default"
                                        >
                                            <core:icon
                                                identifier="actions-save"
                                                size="small"
                                            />

                                            Speichern
                                        </button>
                                    </div>
                                    <div class="border-top pt-3">
                                        <be:link.editRecord
                                            uid="{finding.uid}"
                                            table="{finding.table}"
                                            returnUrl="{f:be.uri(
                                                route: 'mindfula11y_accessibility',
                                                parameters: '{id: pageId, feature: \'interactiveLabels\'}'
                                            )}"
                                        >
                                            Element vollständig bearbeiten
                                        </be:link.editRecord>
                                    </div>
                                </div>
                            </div>
                        </li>
                    </f:for>
                </ul>
            </f:then>
            <f:else>
                <mindfula11y-notice state="success">
                    <span>
                        <f:translate
                            key="LLL:EXT:mindfula11y/Resources/Private/Language/Modules/Accessibility.xlf:interactiveLabels.noFindings"
                        />
                    </span>
                </mindfula11y-notice>
            </f:else>
        </f:if>
    </section>
</f:section>
</html>
